name: Weekly Swim England PB Auto-Update

on:
  schedule:
    # Runs every Wednesday at 05:00 UTC ('0 5 * * 3')
    - cron: '0 5 * * 3'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-pbs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: Run Swim England Scraper & Data Pipeline
        run: python update.py

      - name: Commit and Push Updated Data Files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add raw_data.js raw_data.csv roster.json qualifiers_standards.js \
                  weston-sc-swimmers/raw_data.js weston-sc-swimmers/qualifiers_standards.js \
                  src/raw_data.js src/qualifiers_standards.js \
                  "V1 code base/raw_data.js" data/raw_data.csv scripts/roster.json
          if git diff --staged --quiet; then
            echo "No new PB data changes found."
          else
            git commit -m "Auto-update Swim England PBs [Automated Sync]"
            git push origin main
          fi
